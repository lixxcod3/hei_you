<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson — Hei You</title>
  <link rel="icon" type="image/svg+xml" href="elements/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lesson_style.css" />
  <link rel="stylesheet" href="assistant_style.css" />
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #content-body {
      animation: fadeIn 0.4s ease-out forwards;
    }

    /* Styling tambahan untuk indikator progress (Lego Dots) */
    #dots .brick {
      height: 6px;
      flex: 1;
      background: #d1d5df;
      border: 1px solid var(--navy-dark);
      transition: background 0.3s, transform 0.2s;
    }
    #dots .brick.done { background: var(--emerald); }
    #dots .brick.current { background: var(--gold); transform: scaleY(1.3); }
    #dots .brick.current.lit { background: var(--emerald); }

    /* Button hover animation */
    #btn-complete {
      transition: all 0.2s ease;
    }
    #btn-complete.pop {
      animation: popBtn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes popBtn {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<header class="site-header">
  <!-- Flex Layout Diperbaiki agar tidak tumpang tindih -->
  <div class="wrap nav" style="display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between;">
    
    <!-- LEFT: Logo Terbaru (flex: 0 0 auto) -->
    <a class="logo" href="dashboard.html" aria-label="Back to Classroom" style="flex: 0 0 auto;">
      <svg class="mark" viewBox="0 0 65 40" aria-label="Professor Wáng icon" role="img">
        <g class="logo-head">
          <rect x="2" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/>
          <rect x="31" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/>
          <rect x="8" y="10" width="24" height="3" fill="#C58F3A"/>
          <rect x="10" y="3" width="20" height="8" fill="#2E3A55" stroke="#1C2436" stroke-width="1.5"/>
          <circle cx="20" cy="3" r="2" fill="#C58F3A"/>
          <rect x="11" y="13" width="18" height="14" fill="#E8C48E" stroke="#1C2436" stroke-width="1.5"/>
          <rect x="12" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/>
          <rect x="21" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/>
          <rect x="19" y="17" width="2" height="2" fill="#C58F3A"/>
          <g class="eyes">
            <rect x="14" y="17" width="2" height="2" fill="#1C2436"/>
            <rect x="23" y="17" width="2" height="2" fill="#1C2436"/>
          </g>
          <rect x="13" y="23" width="14" height="2" fill="#9AA3B2"/>
          <rect x="13" y="25" width="2" height="3" fill="#9AA3B2"/>
          <rect x="25" y="25" width="2" height="3" fill="#9AA3B2"/>
          <rect x="8" y="30" width="24" height="9" fill="#A8324A" stroke="#1C2436" stroke-width="1.5"/>
          <rect x="18" y="30" width="4" height="9" fill="#C58F3A"/>
          <circle cx="12" cy="31" r="1.6" fill="#C58F3A"/>
          <circle cx="28" cy="31" r="1.6" fill="#C58F3A"/>
        </g>
        <g class="logo-block">
          <rect x="40" y="12" width="20" height="20" fill="#3F7A5C" stroke="#1C2436" stroke-width="1.5"/>
          <rect x="42" y="14" width="16" height="2" fill="#529c76"/>
          <rect x="46" y="17" width="8" height="2" fill="#fff"/>
          <rect x="44" y="19" width="2" height="6" fill="#fff"/>
          <rect x="46" y="25" width="8" height="2" fill="#fff"/>
        </g>
      </svg>
      <span><b>Hei You</b><small>← Back to Dashboard</small></span>
    </a>

    <!-- MIDDLE: Lesson Title (Truncated safely) -->
    <div class="lesson-title" id="lesson-title" style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 20px; text-align: center; color: var(--gold-light); font-family: var(--pixel); font-size: 13px;">
      Loading Module...
    </div>

    <!-- RIGHT: Dynamic User Menu & PDF Button -->
    <div class="nav-right dont-print" id="nav-actions" style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px;">
      <button class="btn btn-sm btn-ghost" id="btn-print" style="color:var(--cream); border-color:var(--gold); white-space: nowrap; padding: 8px 12px;">🖨️ PDF</button>
    </div>

  </div>
</header>

<main class="lesson-layout">
  <!-- Left Panel: Lesson Theory -->
  <section class="lesson-content">
    
    <!-- Header Sub-Materi & Progress Indicator -->
    <div class="lesson-progress-bar dont-print" style="background: #f0f2f5; border-bottom: 3px solid var(--navy-dark); padding: 18px 40px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;">
        <div id="sub-nav" style="font-weight: 800; font-size: 15px; color: var(--navy-dark); letter-spacing: 0.02em;">Loading sub-lesson...</div>
        <div id="sub-count" style="font-family: var(--pixel); font-size: 11px; color: var(--muted);">0 / 0</div>
      </div>
      <!-- Progress Track -->
      <div style="height: 12px; background: #e2e7f0; border: 2px solid var(--navy-dark); box-shadow: inset 2px 2px 0 rgba(28,36,54,0.1); border-radius: 2px; overflow: hidden;">
        <div id="progress-fill" style="height: 100%; background: var(--emerald); width: 0%; transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);"></div>
      </div>
      <!-- Progress Dots -->
      <div id="dots" style="display: flex; gap: 5px; margin-top: 10px;"></div>
    </div>

    <!-- Materi Pembelajaran -->
    <div class="content-body" id="content-body">
      <!-- Injected from curriculum_data.js -->
    </div>

    <div class="lesson-footer dont-print">
      <button class="btn btn-primary" id="btn-complete" disabled>Run successful code to unlock</button>
    </div>
  </section>

  <!-- Right Panel: Code Editor -->
  <section class="lesson-editor demo-grid dont-print">
    <div class="editor" style="height: 50%;">
      <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="file">main.c</span></div>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="runbar">
        <button class="btn btn-primary" id="run">Compile &amp; Run</button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </div>

    <div class="console" style="height: 50%;">
      <div class="bar">output · stdout</div>
      <div class="out" id="out">Write your solution above and press <b>Compile &amp; Run</b>...</div>
      <div class="verdict" id="verdict">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="3" width="20" height="20" fill="#2E3A55" stroke="#1C2436" stroke-width="2"/><g class="eyes"><rect x="9" y="9" width="3" height="3" fill="#fff"/><rect x="15" y="9" width="3" height="3" fill="#fff"/></g></svg>
        <span>Professor Wáng is watching.</span>
      </div>
    </div>
  </section>
</main>

<script src="session.js"></script>
\
<script src="curriculum_data.js"></script>
<script src="lesson_script.js"></script>
<script src="assistant.js"></script>
</body>
</html>
