<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson — Hei You</title>
  <link rel="icon" type="image/svg+xml" href="elements/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lesson_style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a class="logo" href="dashboard.html" aria-label="Back to Classroom">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="2" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/><rect x="31" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/><rect x="8" y="10" width="24" height="3" fill="#C58F3A"/><rect x="10" y="3" width="20" height="8" fill="#2E3A55" stroke="#1C2436" stroke-width="1.5"/><circle cx="20" cy="3" r="2" fill="#C58F3A"/><rect x="11" y="13" width="18" height="14" fill="#E8C48E" stroke="#1C2436" stroke-width="1.5"/><rect x="12" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/><rect x="21" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/><rect x="14" y="17" width="2" height="2" fill="#1C2436"/><rect x="23" y="17" width="2" height="2" fill="#1C2436"/><rect x="13" y="23" width="14" height="2" fill="#9AA3B2"/><rect x="8" y="30" width="24" height="9" fill="#A8324A" stroke="#1C2436" stroke-width="1.5"/>
      </svg>
      <span><b>Hei You</b><small>← Back to Dashboard</small></span>
    </a>
    
    <div class="lesson-title" id="lesson-title">Loading Module...</div>
    
    <div class="nav-right dont-print">
      <button class="btn btn-sm btn-ghost" id="btn-print" style="color:var(--cream); border-color:var(--gold);">🖨️ Save as PDF</button>
    </div>
  </div>
</header>

<main class="lesson-layout">
  <!-- Left Panel: Lesson Theory -->
  <section class="lesson-content">
    <div class="sub-nav dont-print" id="sub-nav">Loading sub-lesson...</div>
    
    <div class="content-body" id="content-body">
      <!-- Injected from curriculum_data.js -->
    </div>
    
    <div class="lesson-footer dont-print">
      <button class="btn btn-primary" id="btn-complete" disabled>Run successful code to unlock</button>
    </div>
  </section>

  <!-- Right Panel: Code Editor -->
  <section class="lesson-editor demo-grid dont-print">
    <div class="editor" style="height: 50%;">
      <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="file">main.c</span></div>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="runbar">
        <button class="btn btn-primary" id="run">Compile &amp; Run</button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </div>

    <div class="console" style="height: 50%;">
      <div class="bar">output · stdout</div>
      <div class="out" id="out">Write your solution above and press <b>Compile &amp; Run</b>...</div>
      <div class="verdict" id="verdict">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="3" width="20" height="20" fill="#2E3A55" stroke="#1C2436" stroke-width="2"/><g class="eyes"><rect x="9" y="9" width="3" height="3" fill="#fff"/><rect x="15" y="9" width="3" height="3" fill="#fff"/></g></svg>
        <span>Professor Wáng is watching.</span>
      </div>
    </div>
  </section>
</main>

<script src="session.js"></script>
<script src="curriculum_data.js"></script>
<script src="lesson_script.js"></script>
</body>
</html>
