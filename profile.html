<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Hei You</title>
  <link rel="icon" href="elements/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">
  <style>
    .profile-wrap { display: flex; justify-content: center; padding: 60px 24px; min-height: calc(100vh - 74px); }
    .formwrap { background: var(--paper); padding: 40px; border: 3px solid var(--navy-dark); box-shadow: var(--brick); width: 100%; max-width: 480px; }
    hr { border: none; border-top: 3px dashed var(--navy-dark); margin: 30px 0; opacity: 0.2; }
  </style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">
      <svg class="mark" viewBox="0 0 40 40"><rect x="2" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/><rect x="31" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/><rect x="8" y="10" width="24" height="3" fill="#C58F3A"/><rect x="10" y="3" width="20" height="8" fill="#2E3A55" stroke="#1C2436" stroke-width="1.5"/><circle cx="20" cy="3" r="2" fill="#C58F3A"/><rect x="11" y="13" width="18" height="14" fill="#E8C48E" stroke="#1C2436" stroke-width="1.5"/><rect x="12" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/><rect x="21" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/><rect x="14" y="17" width="2" height="2" fill="#1C2436"/><rect x="23" y="17" width="2" height="2" fill="#1C2436"/><rect x="13" y="23" width="14" height="2" fill="#9AA3B2"/><rect x="8" y="30" width="24" height="9" fill="#A8324A" stroke="#1C2436" stroke-width="1.5"/></svg>
      <span><b>Hei You</b><small>Profile</small></span>
    </a>
    <div class="nav-right" id="nav-actions"></div>
  </div>
</header>

<main class="profile-wrap">
  <div class="formwrap">
    <div class="head">
      <h1>Your Profile</h1>
      <p>Manage your account details and password.</p>
    </div>
    
    <div class="banner" id="banner" style="display:none; margin-top:20px;"></div>
    
    <form id="profile-form" style="margin-top:24px;">
      <div class="field">
        <label>Email</label>
        <div class="inpwrap"><input type="email" id="p-email" disabled style="background:#f0f2f5; color:#7a8398; cursor:not-allowed;" /></div>
      </div>
      
      <div class="field" id="f-name">
        <label>Username</label>
        <div class="inpwrap"><input type="text" id="p-name" required /></div>
      </div>
      
      <hr>
      <div class="head"><h2 style="font-size: 16px;">Change Password</h2></div>
      
      <div class="field" id="f-old" style="margin-top:15px;">
        <label>Current Password</label>
        <div class="inpwrap"><input type="password" id="p-old" placeholder="Leave blank to keep current" /></div>
      </div>
      
      <div class="field" id="f-new">
        <label>New Password</label>
        <div class="inpwrap"><input type="password" id="p-new" placeholder="Min 8 characters" /></div>
      </div>
      
      <button type="submit" class="btn btn-primary" id="submit" style="margin-top:10px;">Save Changes</button>
    </form>
    
    <div style="text-align:center; margin-top:20px;"><a class="backhome" href="dashboard.html">← Back to Classroom</a></div>
  </div>
</main>

<script src="session.js"></script>
<script>
  (function(){
    "use strict";
    var key = localStorage.getItem('heiyou_session') || sessionStorage.getItem('heiyou_session');
    if(!key) { window.location.href = 'login.html'; return; }
    
    var users = JSON.parse(localStorage.getItem('heiyou_users') || '{}');
    var user = users[key];
    
    // Auto-fill existing details
    document.getElementById('p-email').value = key;
    document.getElementById('p-name').value = user.name || key.split('@')[0];

    async function hashPw(pw) {
      try {
        if(window.crypto && crypto.subtle) {
          var data = new TextEncoder().encode(pw + '::heiyou-salt');
          var buf = await crypto.subtle.digest('SHA-256', data);
          return 'sha256:' + Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
        }
      } catch(e) {}
      var h=0, s=pw+'::heiyou-salt'; for(var i=0; i<s.length; i++) h=(h*31+s.charCodeAt(i))>>>0;
      return 'weak:'+h.toString(16);
    }

    document.getElementById('profile-form').addEventListener('submit', async function(e){
      e.preventDefault();
      var btn = document.getElementById('submit');
      var banner = document.getElementById('banner');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      var name = document.getElementById('p-name').value.trim();
      var oldP = document.getElementById('p-old').value;
      var newP = document.getElementById('p-new').value;

      user.name = name;

      if (oldP || newP) {
        var oldHash = await hashPw(oldP);
        if (oldHash !== user.pw) {
          banner.className = 'banner show lose';
          banner.innerHTML = '<span>Incorrect current password.</span>';
          btn.disabled = false; btn.textContent = 'Save Changes';
          return;
        }
        if (newP.length < 8) {
          banner.className = 'banner show lose';
          banner.innerHTML = '<span>New password must be at least 8 characters.</span>';
          btn.disabled = false; btn.textContent = 'Save Changes';
          return;
        }
        user.pw = await hashPw(newP);
      }

      users[key] = user;
      localStorage.setItem('heiyou_users', JSON.stringify(users));
      
      banner.className = 'banner show win';
      banner.innerHTML = '<span>Profile updated successfully!</span>';
      document.getElementById('p-old').value = '';
      document.getElementById('p-new').value = '';

      // Update Nav Greeting immediately
      var navName = document.querySelector('.nav-right .btn-sm[href="profile.html"]');
      if(navName) navName.textContent = 'Hi, ' + name;

      btn.disabled = false;
      btn.textContent = 'Save Changes';
    });
  })();
</script>
</body>
</html>
