<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Hei You</title>
  <link rel="icon" type="image/svg+xml" href="elements/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login_style.css" />
  <style>
    .profile-wrap { display: flex; justify-content: center; padding: 60px 24px; min-height: calc(100vh - 74px); }
    .formwrap { background: var(--paper); padding: 40px; border: 3px solid var(--navy-dark); box-shadow: var(--brick); }
    hr { border: none; border-top: 3px dashed var(--navy-dark); margin: 30px 0; opacity: 0.2; }
  </style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html" aria-label="Hei You home">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="2" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/><rect x="31" y="9" width="7" height="4" fill="#C58F3A" stroke="#1C2436" stroke-width="1.5"/><rect x="8" y="10" width="24" height="3" fill="#C58F3A"/><rect x="10" y="3" width="20" height="8" fill="#2E3A55" stroke="#1C2436" stroke-width="1.5"/><circle cx="20" cy="3" r="2" fill="#C58F3A"/><rect x="11" y="13" width="18" height="14" fill="#E8C48E" stroke="#1C2436" stroke-width="1.5"/><rect x="12" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/><rect x="21" y="15" width="7" height="6" fill="none" stroke="#C58F3A" stroke-width="2"/><rect x="14" y="17" width="2" height="2" fill="#1C2436"/><rect x="23" y="17" width="2" height="2" fill="#1C2436"/><rect x="13" y="23" width="14" height="2" fill="#9AA3B2"/><rect x="8" y="30" width="24" height="9" fill="#A8324A" stroke="#1C2436" stroke-width="1.5"/>
      </svg>
      <span><b>Hei You</b><small>嘿，你 · learn C</small></span>
    </a>
    <div class="nav-right" id="nav-actions">
      <!-- Session.js will dynamically populate this if logged in -->
    </div>
  </div>
</header>

<main class="profile-wrap">
  <div class="formwrap">
    <div class="head">
      <h1>Your Profile</h1>
      <p>Manage your account settings and credentials.</p>
    </div>

    <div class="banner" id="banner" role="status" aria-live="polite"></div>

    <form id="profile-form" novalidate>
      <div class="field">
        <label for="p-email">Email (Cannot be changed)</label>
        <div class="inpwrap">
          <input type="email" id="p-email" readonly disabled style="background:#f0f2f5; color:#7a8398; cursor:not-allowed;" />
        </div>
      </div>

      <div class="field" id="f-name">
        <label for="p-name">Username</label>
        <div class="inpwrap">
          <input type="text" id="p-name" placeholder="How should Professor Wáng call you?" />
        </div>
        <span class="msg" id="m-name">Please enter a valid username.</span>
      </div>

      <hr>
      <div class="head"><h2 style="font-size: 16px;">Change Password</h2></div>

      <div class="field" id="f-old-pass" style="margin-top: 15px;">
        <label for="p-old-pass">Current Password</label>
        <div class="inpwrap"><input type="password" id="p-old-pass" placeholder="Leave blank to keep current" /></div>
      </div>

      <div class="field" id="f-new-pass">
        <label for="p-new-pass">New Password</label>
        <div class="inpwrap"><input type="password" id="p-new-pass" placeholder="Minimum 8 characters" /></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit" style="margin-top:10px;">Save Changes</button>
      <div style="text-align:center; margin-top:20px;"><a class="backhome" href="dashboard.html">← Back to Classroom</a></div>
    </form>
  </div>
</main>

<script src="session.js"></script>
<script src="profile_script.js"></script>
</body>
</html>
